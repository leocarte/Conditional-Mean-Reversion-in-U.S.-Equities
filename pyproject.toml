[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlfinance"
version = "0.1.0"
description = "Conditional Mean Reversion in U.S. Equities: Machine Learning, Regime Dependence, and Transaction Costs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Giacomo Case" },
    { name = "Leonardo Cartesegna" },
]
keywords = ["finance", "machine-learning", "crsp", "asset-pricing", "fin-407"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch~=2.5",
    "pandas~=2.2",
    "numpy~=2.1",
    "scikit-learn~=1.6",
    "xgboost~=3.0",
    "lightgbm~=4.5",
    "statsmodels>=0.14.5,<0.15",
    "hydra-core~=1.3",
    "pyarrow~=18.1",
    "pyyaml~=6.0",
    "tqdm~=4.67",
    "matplotlib~=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-cov~=5.0",
    "ruff~=0.7",
    "black~=24.10",
    "mypy~=1.13",
]

[project.urls]
"Homepage" = "https://github.com/giacomocase/ML_For_Finance_Project-GiacomoCase-406974-LeonardoCartesegna-408405"
"Bug Tracker" = "https://github.com/giacomocase/ML_For_Finance_Project-GiacomoCase-406974-LeonardoCartesegna-408405/issues"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["mlfinance*"]
exclude = ["tests*", "data*", "report*", "mlruns*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "data",
    "mlruns",
    "report",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy-specific
]
ignore = [
    "E501",  # line too long - handled by formatter
    "B008",  # function calls in default args (common in Hydra / typer)
]

[tool.ruff.lint.isort]
known-first-party = ["mlfinance"]

[tool.ruff.lint.per-file-ignores]
# The nonlinear benchmark nonlinear smoke modules skip at module level
# (SKIP_NONLINEAR_BENCHMARK_SMOKE) *before* importing the torch + xgboost stack
# to dodge the macOS conda duplicate-OpenMP segfault, which places those imports
# after a statement (E402).
"tests/run/test_nonlinear_benchmarks.py" = ["E402"]
"tests/integration/test_nonlinear_benchmarks.py" = ["E402"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.venv
    | build
    | dist
    | data
    | mlruns
    | report
  )/
)
'''

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "gpu: marks tests that require a CUDA device",
]

# ---------------------------------------------------------------------------
# Mypy (loose - pinned types not required for the final report)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["data/", "mlruns/", "report/", "build/", "dist/"]
